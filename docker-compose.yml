# Local services for KDP Product Factory development.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kdp_factory
    ports: ['5432:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
  redis:
    image: redis:7
    ports: ['6379:6379']
  minio:
    # Optional S3-compatible storage (set STORAGE_DRIVER=s3, S3_ENDPOINT=http://localhost:9000, S3_BUCKET=kdp).
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    profiles: ['s3']
volumes:
  pgdata:
